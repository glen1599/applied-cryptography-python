[project]
name = "applied-cryptography-python"
version = "1.0.0"
description = "Classical ciphers implemented with exact integer arithmetic, as testable Python modules."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Glen Devit Renaldi" }]
keywords = ["cryptography", "hill-cipher", "classical-ciphers", "education"]

dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/glen1599/applied-cryptography-python"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
# README snippets are illustrative, and the notebooks are the original coursework
# artefacts: their style smells are part of the record, so only src/ and tests/ are
# held to the linter.
extend-exclude = ["README.md", "notebooks"]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
